name: Check SAKURA app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir .local/worker-build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm test
